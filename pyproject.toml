[project]
name = "strainx-quote-compare"
version = "0.1.0"
description = "StrainX purchase requisition & quote comparison engine + API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "groq>=0.11",
    "supabase>=2.7",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
